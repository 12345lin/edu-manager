spring:
  application:
  name: edu-manager
  #  mysql连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/edu  #本机环境
#    url: jdbc:mysql://192.168.63.129:3306/edu  远程环境
    #docker 容器
#    url: jdbc:mysql://mysql:3306/edu
    username: root
    password: 123456

  servlet:
    multipart:
#      单个文件大小
        max-file-size: 10MB
#        最大请求大小（包括所有文件和表单数据）
        max-request-size: 100MB
#    mybtis相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 开启驼峰命名法
    map-underscore-to-camel-case: true
  mapper-locations: classpath:com/wmm/Mapper/*.xml
#开启事务控制日志级别
logging:
    level:
      org.springframework.jdbc.support.JdbcTransactionManager: debug
#阿里云OSS
aliyun:
  oss:
      endpoint: https://oss-cn-beijing.aliyuncs.com
      bucketName: wmmya
      region: cn-beijing

